name: Sync original theme assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-theme-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download final approved theme images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/themes

          curl -fL --retry 3 --user-agent "Mozilla/5.0"             "https://i.pinimg.com/736x/4f/74/b5/4f74b55554fe6182d53987bc375965d3.jpg"             -o assets/themes/persian-turquoise.jpg

          curl -fL --retry 3 --user-agent "Mozilla/5.0"             "https://fabricmegastore.com/cdn/shop/files/LapisLazuliGemstonesPattern_1.png?v=1762475136&width=1000"             -o assets/themes/lapis-gold.png

          curl -fL --retry 3 --user-agent "Mozilla/5.0"             "https://static.wixstatic.com/media/7335d9_93c7cf2e5df14e04940e66957eef8106~mv2.jpeg"             -o assets/themes/isfahan-tile.jpg

          curl -fL --retry 3 --user-agent "Mozilla/5.0"             "https://essiecarpets-cdn-1.s3.eu-west-2.amazonaws.com/wp-content/uploads/2019/07/25221027/Essie2379.jpg"             -o assets/themes/persian-carpet.jpg

          echo "Downloaded assets:"
          ls -lh assets/themes
          file assets/themes/*

      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/themes
          if git diff --cached --quiet; then
            echo "Theme assets already match."
            exit 0
          fi
          git commit -m "assets: add final approved Persian theme backgrounds"
          git push
