name: Publish Voice Compressor v1.2.0

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare standalone release file
        run: cp index.html voice-compressor.html

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists; refreshing asset."
            gh release upload v1.2.0 voice-compressor.html --clobber
          else
            gh release create v1.2.0 voice-compressor.html \
              --target "${{ github.sha }}" \
              --title "Voice Compressor v1.2.0" \
              --notes-file - <<'EOF'
          ## Voice Compressor v1.2.0

          Theme artwork update using the final approved image backgrounds from the PDF Tolkit design work.

          ### New
          - Real image background for **Persian Turquoise**
          - Real image background for **Lapis & Gold**
          - Final replacement **Isfahan Tile** image, displayed with cover sizing
          - Full-page fitted **Persian Carpet** background
          - Theme-aware translucent panels for readability
          - Dark readable Turquoise surfaces, matching the final approved theme direction
          - Carpet treatment keeps the full rug visible while reducing visual red dominance

          ### Still included
          - English / Persian / Arabic interface
          - Automatic LTR / RTL
          - Saved theme and language preferences
          - M4A and common audio inputs → MP3
          - Speech-optimized 48 kbps + Mono preset
          - Local browser audio processing

          Download **voice-compressor.html** and open it in Chrome or Edge.
          EOF
          fi
