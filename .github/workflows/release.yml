name: Publish Voice Compressor v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare standalone release file
        run: cp index.html voice-compressor.html

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; refreshing asset."
            gh release upload v1.1.0 voice-compressor.html --clobber
          else
            gh release create v1.1.0 voice-compressor.html \
              --target "${{ github.sha }}" \
              --title "Voice Compressor v1.1.0" \
              --notes-file - <<'EOF'
          ## Voice Compressor v1.1.0

          Multilingual and multi-theme update.

          ### New
          - Four Iranian-inspired themes from the latest approved PDF Tolkit design:
            - Persian Turquoise
            - Lapis & Gold
            - Isfahan Tile
            - Persian Carpet
          - English, Persian and Arabic interface
          - Automatic RTL layout for Persian and Arabic
          - LTR layout for English
          - Theme and language preferences are saved locally
          - All dynamic compression messages are localized

          ### Existing features
          - M4A, MP3, WAV and other common audio formats
          - MP3 output from 24 to 128 kbps
          - Speech-optimized 48 kbps + Mono preset
          - Local browser processing
          - Standalone HTML download

          Download **voice-compressor.html** and open it in Chrome or Edge.
          EOF
          fi
